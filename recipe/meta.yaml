{% set name = "pysmiles" %}
{% set version = "2.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pysmiles-{{ version }}.tar.gz
  sha256: f46da32683dc59d209921a75b1cb61d4dfa85e08948e3bb0b356b1d3d959f78d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=30.3.0
    - pbr
    - pip
  run:
    - python >={{ python_min }}
    - pbr
    - networkx >=3.1

test:
  imports:
    - pysmiles
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pckroon/pysmiles
  summary: A lightweight SMILES reader and writer
  license: Apache-2.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - awvwgk
